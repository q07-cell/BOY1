<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOY1 — 턴 기반 탈출 퍼즐게임</title>
<meta name="description" content="폐기된 휴머노이드 보이원의 탈출. 턴 기반 탈출 퍼즐게임 — iOS. 준비 중.">
<meta property="og:title" content="BOY1 — 턴 기반 탈출 퍼즐게임">
<meta property="og:description" content="타워 가장 깊은 어둠에 한대의 로봇이 버려졌다. 인간적 결함을 가진 기계의 운명은?">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{ --bg:#06070a; --ink:#dfe8ff; --dim:#7d879c; }
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Galmuri11','Galmuri9',monospace; font-weight:400;
  line-height:1.8; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:48px 24px 110px;
}
.logo{ width:min(195px,42vw); height:auto; display:block; }
.soon{ margin-top:34px; font-size:clamp(12px,3vw,14px); color:var(--dim); letter-spacing:.14em;
  animation:bl 1.6s steps(2,jump-none) infinite; }
@keyframes bl{ 50%{opacity:.25} }
footer{ position:fixed; left:0; right:0; bottom:0; padding:22px 24px;
  font-size:11px; color:var(--dim); line-height:1.9; }
footer a{ color:var(--dim); }
</style>
</head>
<body>

<img class="logo" src="assets/boy1_lettering_white.png" alt="보이원 BOY1">
<p class="soon">준비 중 · COMING SOON</p>

<footer>
  BOY1 © 2026 SHINBAEKSAEK ·
  <a href="privacy.html">개인정보처리방침 / Privacy Policy</a> ·
  <a href="https://www.instagram.com/shinbaeksaek" target="_blank" rel="noopener">@shinbaeksaek</a>
</footer>

<script>
// 로고 폭 = '준비 중 · COMING SOON' 텍스트 실측 폭 동기
const _l=document.querySelector('.logo'), _s=document.querySelector('.soon');
const fit=()=>{ _l.style.width=_s.getBoundingClientRect().width+'px'; };
addEventListener('resize',fit);
document.fonts ? document.fonts.ready.then(fit) : fit();
fit();
</script>
</body>
</html>
