<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOY1 — 턴 기반 탈출 퍼즐게임</title>
<meta name="description" content="폐기된 휴머노이드 보이원의 탈출. 턴 기반 탈출 퍼즐게임 — iOS.">
<meta property="og:title" content="BOY1 — 턴 기반 탈출 퍼즐게임">
<meta property="og:description" content="타워 가장 깊은 어둠에 한대의 로봇이 버려졌다. 인간적 결함을 가진 기계의 운명은?">
<meta property="og:image" content="assets/cover_ko.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{ --bg:#07090e; --line:#242b3a; --ink:#dfe8ff; --dim:#7f8aa0; }
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Galmuri11','Galmuri9',monospace; font-weight:400;
  line-height:1.85;
}
img{max-width:100%; display:block}
.wrap{max-width:520px; margin:0 auto; padding:0 20px; text-align:center}

/* 커버 */
.cover{padding:34px 20px 0}
.cover img{width:min(480px,100%); margin:0 auto}

/* CTA */
.cta{padding:44px 20px 72px; text-align:center}
.btn{
  display:inline-block; padding:15px 30px; font-family:inherit;
  font-size:13px; letter-spacing:.1em; text-decoration:none;
  border:1px solid var(--line); color:var(--dim); pointer-events:none;
}
/* 출시 시: href에 App Store 링크, border-color/color를 --ink로, pointer-events 제거 */

/* 플레이 움짤 */
.plays{display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:720px; margin:0 auto; padding:0 20px 84px}
.play img{border:1px solid var(--line); width:100%}
.play figcaption{margin-top:14px; font-size:12px; color:var(--dim); line-height:1.9; text-align:left}
.play figcaption b{color:var(--ink); font-weight:400}
@media (max-width:560px){ .plays{grid-template-columns:1fr} }

footer{border-top:1px solid var(--line); padding:40px 20px 56px;
  text-align:center; font-size:11.5px; color:var(--dim); line-height:2.1}
footer a{color:var(--dim)}
</style>
</head>
<body>

<div class="cover"><img src="assets/cover_ko.jpg" alt="BOY1 커버 아트"></div>

<div class="cta"><a class="btn" href="#">APP STORE — COMING SOON</a></div>

<div class="plays">
  <figure class="play">
    <img src="assets/gif_decoy.gif" alt="유인 플레이">
    <figcaption><b>유인.</b> 콘솔에 가짜 오류를 흘리면 로봇이 그걸 고치러 온다.
    비워진 길로, 얼굴을 벗고 지나간다.</figcaption>
  </figure>
  <figure class="play">
    <img src="assets/gif_break.gif" alt="정지와 돌파 플레이">
    <figcaption><b>정지, 그리고 돌파.</b> 감정 신호로 로봇을 멈춰 세우고, 균열된 벽을 부순다.
    소음을 들은 로봇이 쫓아온다.</figcaption>
  </figure>
</div>

<footer>
  BOY1 © 2026 SHINBAEKSAEK<br>
  <a href="../privacy.html">개인정보처리방침 / Privacy Policy</a> ·
  <a href="https://www.instagram.com/shinbaeksaek" target="_blank" rel="noopener">@shinbaeksaek</a> ·
  <a href="mailto:berserker718@gmail.com">berserker718@gmail.com</a>
</footer>

</body>
</html>
