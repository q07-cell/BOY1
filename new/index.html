<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOY1 — 턴 기반 탈출 퍼즐게임</title>
<meta name="description" content="폐기된 휴머노이드 보이원의 탈출. 턴 기반 탈출 퍼즐게임 — iOS.">
<meta property="og:title" content="BOY1 — 턴 기반 탈출 퍼즐게임">
<meta property="og:description" content="타워 가장 깊은 어둠에 한대의 로봇이 버려졌다. 인간적 결함을 가진 기계의 운명은?">
<meta property="og:image" content="assets/cover_ko.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{ --bg:#07090e; --band:#0d1117; --line:#242b3a; --ink:#dfe8ff; --dim:#7f8aa0; }
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Galmuri11','Galmuri9',monospace; font-weight:400;
  line-height:1.85;
}
img{max-width:100%; display:block}

/* 커버 */
.cover{padding:34px 20px 40px}
.cover img{width:min(480px,100%); margin:0 auto}

/* CTA 밴드 — 커버·소개와 구별되는 살짝 밝은 배경 */
.cta{background:var(--band); border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:52px 20px; text-align:center}
.cta .soon{font-size:clamp(13px,3.4vw,15px); letter-spacing:.22em; color:var(--ink);
  margin-bottom:26px; animation:bl 1.6s steps(2,jump-none) infinite}
@keyframes bl{ 50%{opacity:.3} }
.cta .badge{width:176px; margin:0 auto; opacity:.45; filter:grayscale(.4)}  /* 비활성 뷰 — 출시 시 dim 제거 */
/* 출시 시: .badge를 <a href="앱스토어 링크">로 감싸기 */

/* 게임 소개 */
.intro{max-width:600px; margin:0 auto; padding:76px 24px 80px; text-align:center;
  font-size:clamp(13px,3.5vw,14.5px)}
.intro .sec{font-size:clamp(15px,4vw,17px); letter-spacing:.3em; margin-bottom:44px}
.faceloop{width:min(320px,76vw); margin:0 auto 28px; image-rendering:pixelated}
.intro .sub{font-size:clamp(16.5px,4.4vw,21px); font-weight:400; letter-spacing:.02em;
  margin-bottom:26px; line-height:1.7}
.intro p+p{margin-top:22px}

/* 실플레이 움짤 */
.plays{display:grid; grid-template-columns:1fr 1fr; gap:22px; max-width:720px; margin:0 auto; padding:0 20px 84px}
.plays img{border:1px solid var(--line); width:100%}
@media (max-width:560px){ .plays{grid-template-columns:1fr} }

footer{border-top:1px solid var(--line); padding:40px 20px 56px;
  text-align:center; font-size:11.5px; color:var(--dim); line-height:2.1}
footer a{color:var(--dim)}
</style>
</head>
<body>

<div class="cover"><img src="assets/cover_ko.jpg" alt="BOY1 커버 아트"></div>

<div class="cta">
  <p class="soon">COMING SOON</p>
  <img class="badge" src="assets/appstore_badge.svg" alt="Download on the App Store">
</div>

<div class="intro">
  <p class="sec">게임 소개</p>
  <img class="faceloop" src="assets/face_loop.gif" alt="보이원 FACE ON/OFF">
  <h2 class="sub">BOY1은 턴 기반 탈출 퍼즐 게임입니다</h2>
  <p>얼굴(FACE)을 장착하는 순간 보이원의 다양한 능력이 깨어납니다.
  시스템에 종속된 로봇들 사이에 기계인 척 섞여 있다가,
  치명적인 오류를 일으켜 로봇들을 속이세요.
  발각되지 않고 한 층, 한 층 타워 꼭대기까지 올라가는 것이 목표입니다.</p>
</div>

<div class="plays">
  <img src="assets/gif_decoy.gif" alt="유인 플레이">
  <img src="assets/gif_break.gif" alt="정지와 돌파 플레이">
</div>

<footer>
  BOY1 © 2026 SHINBAEKSAEK<br>

  <a href="mailto:berserker718@gmail.com">berserker718@gmail.com</a>
</footer>

</body>
</html>
